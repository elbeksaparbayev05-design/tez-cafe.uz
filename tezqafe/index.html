    <title>TezQafe - Express Fast Food</title>
    <!-- Prevent Theme Flash -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('tezqafe_theme');
          if (saved === 'light') {
            document.documentElement.classList.сьвremove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  </body>

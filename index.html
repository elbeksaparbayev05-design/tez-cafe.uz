<!DOCTYPE html>
<html lang="uz" class="dark h-full min-h-screen">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TezQafe - Express Fast Food POS & Ordering System</title>

  <!-- Prevent Theme Flashing (FOUC) on Initial Load — Default to Dark Mode -->
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('tezqafe_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#D62828',
              'red-dark': '#B81D1D',
              yellow: '#FFC300',
              cream: '#FFF8EC',
              brown: '#5C3A21',
              green: '#3A7D44',
              charcoal: '#1F1F1F',
              surface: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen w-full m-0 p-0 bg-[#FFF8EC] dark:bg-[#121212] text-[#1F1F1F] dark:text-gray-100 transition-colors duration-200 overflow-x-hidden">

  <div id="root" class="min-h-screen w-full flex flex-col bg-[#FFF8EC] dark:bg-[#121212]"></div>

  <script type="text/babel" src="./app.js"></script>
</body>
</html>
